<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Particle Tracking — coming soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #050446;
        --accent: #0038b1;
        --muted: rgba(255, 255, 255, 0.72);
        --font: 'Raleway', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--font);
        color: #fff;
        background:
          radial-gradient(900px 480px at 12% -10%, rgba(0, 56, 177, 0.45), transparent 55%),
          radial-gradient(700px 420px at 100% 10%, rgba(37, 99, 235, 0.2), transparent 50%),
          linear-gradient(165deg, #050446 0%, #0a0a5c 55%, #0038b1 140%);
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main {
        width: min(36rem, 100%);
        text-align: center;
        animation: rise 0.7s ease both;
      }
      .logo {
        font-weight: 800;
        font-size: clamp(1.4rem, 4vw, 1.75rem);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
      }
      .logo .dot {
        position: relative;
      }
      .logo .dot::after {
        content: '';
        position: absolute;
        top: 0.05em;
        left: 50%;
        width: 0.28em;
        height: 0.28em;
        margin-left: -0.14em;
        border-radius: 50%;
        background: #fff;
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.15;
        margin: 0 0 0.85rem;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.55;
      }
      .badge {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.45rem 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Part<span class="dot">i</span>cle</div>
      <h1>Order tracking</h1>
      <p>
        <strong>tracking.particleformen.com</strong> is live on HTTPS.<br />
        The Particle tracking platform will be deployed here next.
      </p>
      <div class="badge">Welcome · SSL OK</div>
    </main>
  </body>
</html>
