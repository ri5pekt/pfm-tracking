services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm
      POSTGRES_DB: pfm_tracking
    ports:
      - "5432:5432"
    volumes:
      - pfm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm -d pfm_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://pfm:pfm@postgres:5432/pfm_tracking
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]
    profiles: ["tools"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgres://pfm:pfm@postgres:5432/pfm_tracking
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    env_file: .env
    environment:
      DATABASE_URL: postgres://pfm:pfm@postgres:5432/pfm_tracking
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pfm_pg:
