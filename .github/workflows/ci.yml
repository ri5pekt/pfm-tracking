name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Test API
        run: npm test -w api

      - name: Build packages
        run: npm run build

      - name: Build Docker images
        env:
          GIT_SHA: ${{ github.sha }}
          APP_VERSION: "0.1.0"
        run: |
          docker build -f api/Dockerfile --build-arg GIT_SHA="$GIT_SHA" --build-arg APP_VERSION="$APP_VERSION" -t pfm-tracking-api:$GIT_SHA .
          docker build -f worker/Dockerfile --build-arg GIT_SHA="$GIT_SHA" --build-arg APP_VERSION="$APP_VERSION" -t pfm-tracking-worker:$GIT_SHA .
          docker build -f admin/Dockerfile -t pfm-tracking-admin:$GIT_SHA .
