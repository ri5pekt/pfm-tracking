server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /admin/ {
    proxy_pass http://api:3000/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  location /t/ {
    proxy_pass http://api:3000/t/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /lookup {
    proxy_pass http://api:3000/lookup;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /go {
    proxy_pass http://api:3000/go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /products/ {
    proxy_pass http://api:3000/products/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /brand/ {
    proxy_pass http://api:3000/brand/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }

  location /health/ready {
    proxy_pass http://api:3000/health/ready;
  }

  location /health/ops {
    proxy_pass http://api:3000/health/ops;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
